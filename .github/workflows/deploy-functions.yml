# Deploys Supabase Edge Functions when anything under supabase/functions/ changes on main.
# Needs the repo secret SUPABASE_ACCESS_TOKEN (scoped to the combo-locker project, Edge Functions write).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zirktoidxwdivbztzyhg
    steps:
      - uses: actions/checkout@v5
      # The CLI comes from npm (the setup-cli action looks up releases via GitHub's API and gets rate-limited).
      # Each folder is one function. --use-api bundles on Supabase's side (no Docker needed); --yes skips the confirm prompt CI can't answer.
      # Function settings (verify_jwt) are kept as they are on Supabase.
      - name: Deploy functions
        run: npx --yes supabase@latest functions deploy --remote="$PROJECT_REF" --use-api --yes
